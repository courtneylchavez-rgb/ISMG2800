<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8eaff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #7b2cbf;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        /* Navigation bar */
        nav {
            background-color: #d63384;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            display: block;
        }

        nav a:hover {
            background-color: #7b2cbf;
            color: #ffccff;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #9d4edd;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #d63384;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            display: block;
            text-align: left;
            margin-left: 4%;
            font-weight: bold;
        }

        #result {
            font-weight: bold;
            color: #7b2cbf;
            margin-top: 15px;
        }

        /* Responsive navigation */
        @media screen and (max-width: 500px) {
            nav {
                flex-direction: column;
            }

            nav a {
                text-align: center;
            }

            .container {
                margin: 20px 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Random Website Selector</h1>
        <p>Generate a random number and visit a website!</p>
    </header>

    <!-- Navigation bar -->
    <nav>
        <a href="https://www.yahoo.com">Yahoo</a>
        <a href="https://www.google.com">Google</a>
        <a href="https://www.facebook.com/login/">Facebook</a>
    </nav>

    <div class="container">
        <h2>Random Number Generator</h2>

        <p>Click the button to generate a random number between 1 and 10.</p>

        <button onclick="chooseWebsite()">Generate Number</button>

        <p id="result"></p>
    </div>

    <div class="container">
        <h2>Contact Form</h2>

        <form onsubmit="return validateForm()">

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your email">

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter a password">

            <button type="submit">Submit Form</button>

        </form>
    </div>

    <script>

        // Generate a random number and choose a website
        function chooseWebsite() {

            let number = Math.floor(Math.random() * 10) + 1;

            document.getElementById("result").innerHTML =
                "Your random number is: " + number;

            if (number < 3) {
                document.getElementById("result").innerHTML +=
                    "<br>Taking you to Yahoo!";

                setTimeout(function() {
                    window.location.href = "https://www.yahoo.com";
                }, 2000);

            } else if (number >= 3 && number <= 5) {
                document.getElementById("result").innerHTML +=
                    "<br>Taking you to Google!";

                setTimeout(function() {
                    window.location.href = "https://www.google.com";
                }, 2000);

            } else {
                document.getElementById("result").innerHTML +=
                    "<br>Taking you to Facebook!";

                setTimeout(function() {
                    window.location.href = "https://www.facebook.com/login/";
                }, 2000);
            }
        }

        // Validate the three form fields
        function validateForm() {

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            if (name === "") {
                alert("Please enter your name.");
                return false;
            }

            if (!email.includes("@") || !email.includes(".")) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password.length < 6) {
                alert("Your password must be at least 6 characters long.");
                return false;
            }

            alert("Your form was submitted successfully!");
            return false;
        }

    </script>

</body>
</html>
