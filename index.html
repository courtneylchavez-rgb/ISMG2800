<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Statements</title>

    <style>
        /* Page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f0ff;
            margin: 0;
            padding: 20px;
        }

        /* Header styling */
        header {
            background-color: #6a0dad;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 10px;
        }

        /* Navigation bar styling */
        nav {
            background-color: #333;
            overflow: hidden;
            margin-top: 15px;
            border-radius: 5px;
        }

        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #e75480;
            color: white;
        }

        /* Paragraph styling */
        p {
            color: #4b286d;
            font-size: 18px;
            background-color: white;
            padding: 12px;
            margin: 10px 0;
            border-left: 5px solid #c084fc;
            border-radius: 5px;
        }

        /* Button-style link with opacity */
        .button {
            display: inline-block;
            background-color: rgba(106, 13, 173, 0.8);
            color: white;
            padding: 12px 24px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .button:hover {
            opacity: 0.6;
        }

        /* Responsive design for screens 480px and wider */
        @media screen and (min-width: 480px) {
            body {
                padding: 30px;
            }

            header {
                font-size: 20px;
            }

            p {
                font-size: 20px;
            }
        }

        /* Keep navigation and content usable on smaller screens */
        @media screen and (max-width: 479px) {
            nav a {
                float: none;
                width: auto;
            }

            body {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>JavaScript Statements</h1>
        <p>Learn how JavaScript variables and math work!</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact Us</a>
    </nav>

    <main>
        <section id="about">
            <h2>About JavaScript</h2>
            <p>JavaScript statements are separated by semicolons.</p>
        </section>

        <section id="services">
            <h2>JavaScript Results</h2>

            <p id="demo1"></p>
            <p id="demo2"></p>
            <p id="demo3"></p>
            <p id="demo4"></p>
            <p id="demo5"></p>
        </section>

        <section id="contact">
            <h2>Learn More</h2>
            <p>Visit Google to explore more information online.</p>
            <a class="button" href="https://www.google.com" target="_blank">
                Visit Google
            </a>
        </section>
    </main>

    <script>
        let a = 10;
        let b = 5;
        let c = a - b;
        let d = 15;
        let e = c + d;

        document.getElementById("demo1").innerHTML = "a = " + a;
        document.getElementById("demo2").innerHTML = "b = " + b;
        document.getElementById("demo3").innerHTML = "c = a - b = " + c;
        document.getElementById("demo4").innerHTML = "d = " + d;
        document.getElementById("demo5").innerHTML = "e = c + d = " + e;
    </script>

</body>
</html>
